[project]
name = "protokflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "JongSeonKim", email = "jongseon9312@gmail.com" }]
dependencies = [
  "aiosqlite==0.22.1",
  "cappa==0.32.2",
  "fastapi==0.139.0",
  "fastapi-pagination==0.15.16",
  "greenlet==3.5.5",
  "loguru==0.7.3",
  "msgspec==0.21.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pyyaml==6.0.3",
  "sqlalchemy==2.0.52",
  "starlette==1.6.0",
  "starlette-context==0.5.1",
  "user-agents==2.2.0",
  "uvicorn==0.52.4",
]

[project.scripts]
protokflow = "backend.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pre-commit-hooks==6.0.0",
  "prek==0.4.10",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-sugar==1.1.1",
  "pytest-xdist==3.6.1",
  "ruff==0.15.22",
  "tombi==1.2.2",
  "types-psutil>=7.2.2.20260518",
  "types-python-jose>=3.5.0.20260408",
  "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
